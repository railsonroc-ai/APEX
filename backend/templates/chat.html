<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX › ADS — Programação</title>

<!-- Libs Externas (Highlight.js, Marked e DOMPurify) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/chat-shared.css') }}">
<style>
  :root {
    --accent: #00d4ff;
    --accent-text: #000;
  }
  .memory-badge {
    font-size: .7rem; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px;
    cursor: default; white-space: nowrap; letter-spacing: .3px;
  }
  .mem-clear-btn {
    font-size: .72rem; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px;
    cursor: pointer; transition: color .2s, border-color .2s;
  }
  .mem-clear-btn:hover { color: #ff6b6b; border-color: #ff6b6b; }
</style>
</head>
<body>

<header>
  <div class="status-dot"></div>
  <span class="logo">APEX</span>
  <span id="memory-badge" class="memory-badge" data-count="{{ total_msgs }}">🧠 {{ total_msgs }} msgs</span>
  <nav class="breadcrumb">
    <span class="sep">›</span>
    <a href="/">Início</a>
    <span class="sep">›</span>
    <span class="current">💻 ADS</span>
  </nav>
  <nav class="header-right">
    <button class="mem-clear-btn" onclick="clearMemory()" title="Apagar histórico persistente">🧹 Limpar memória</button>
    <a href="/estudos">📘 Estudos ADS</a>
  </nav>
</header>

<main id="messages">
  <div class="welcome" id="welcome">
    <h2>💻 ADS — Programação</h2>
    <p>Tire dúvidas de código, banco de dados, lógica e tudo sobre Análise e Desenvolvimento de Sistemas.</p>
    <div class="quick-grid">
      <button class="quick-btn" onclick="ask('O que é POO? Explica com exemplos em Python.')">🔷 O que é POO?</button>
      <button class="quick-btn" onclick="ask('Explica funções em programação com exemplos práticos.')">⚙️ Explica funções</button>
      <button class="quick-btn" onclick="ask('O que é banco de dados relacional? Dê exemplos com SQL.')">🗄️ Banco de dados</button>
      <button class="quick-btn" onclick="ask('Como usar Git básico? Explica add, commit, push.')">🌿 Git básico</button>
      <button class="quick-btn" onclick="ask('Qual a diferença entre HTML e CSS? Com exemplos.')">🎨 HTML vs CSS</button>
      <button class="quick-btn" onclick="ask('O que é uma API REST? Como funciona na prática?')">🔌 API REST</button>
      <button class="quick-btn" onclick="ask('O que é recursão? Explica com um exemplo simples.')">🔁 Recursão</button>
      <button class="quick-btn" onclick="ask('Qual a diferença entre var, let e const em JavaScript?')">📜 var/let/const</button>
    </div>
  </div>
</main>

<div class="input-bar">
  <textarea id="user-input"
    placeholder="Pergunte sobre programação, ADS, banco de dados… (Enter envia)"
    aria-label="Mensagem de entrada"
    rows="1"></textarea>
  <button class="clear-btn" onclick="clearChat()" title="Limpar conversa da tela">🗑</button>
  <button id="send-btn" onclick="sendMessage()">Enviar ↑</button>
</div>

<div id="toast"></div>

<script>window.APEX_CHAT_CONFIG = { area: 'ads', lang: 'pt-BR', label: 'ADS' };</script>
<script src="{{ url_for('static', filename='js/chat-engine.js') }}" defer></script>
<script>
function clearMemory() {
  const area = window.APEX_CHAT_CONFIG ? window.APEX_CHAT_CONFIG.area : 'ads';
  if (!confirm(`Apagar toda a memória de ${area.toUpperCase()}? Esta ação não pode ser desfeita.`)) return;
  
  const headers = { 'Content-Type': 'application/json' };
  const key = localStorage.getItem('apex_key');
  if (key) headers['X-Apex-Key'] = key;

  fetch(`/api/memory?area=${area}`, { method: 'DELETE', headers })
    .then(r => {
      if (r.status === 401) {
        const secret = prompt("Acesso protegido. Digite a sua chave APEX_ACCESS_KEY:");
        if (secret) {
          localStorage.setItem('apex_key', secret);
          return clearMemory();
        }
        throw new Error("Não autorizado");
      }
      return r.json();
    })
    .then(d => {
      if (d && d.ok) {
        const badge = document.getElementById('memory-badge');
        if (badge) {
          badge.textContent = '🧠 0 msgs';
          badge.dataset.count = '0';
        }
        if (typeof window.toast === 'function') window.toast('Memória apagada!');
      }
    })
    .catch(() => { 
      if (typeof window.toast === 'function') window.toast('Erro ao apagar memória.'); 
    });
}
</script>

</body>
</html>
