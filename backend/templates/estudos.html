<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX — Painel de Estudos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060d14;
    --surface: #0b1a27;
    --border: #0d4f6e;
    --accent: #00d4ff;
    --text: #c9f1ff;
    --muted: #4a7a96;
    --ads: #00d4ff;
    --font: 'Segoe UI', system-ui, sans-serif;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    text-decoration: none;
  }
  .header-nav { margin-left: auto; display: flex; gap: 20px; }
  .header-nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: .8rem;
    transition: color .2s;
  }
  .header-nav a:hover, .header-nav a.active { color: var(--accent); }

  /* MAIN */
  main {
    flex: 1;
    padding: 28px 24px;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }

  h1 { font-size: 1.4rem; color: var(--accent); margin-bottom: 4px; }
  .subtext { color: var(--muted); font-size: .82rem; margin-bottom: 28px; }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card h2 { font-size: .95rem; color: var(--accent); margin-bottom: 16px; letter-spacing: 1px; }

  /* AREA STATS */
  .area-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .area-label {
    min-width: 80px;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .bar-wrap {
    flex: 1;
    background: #0a1a26;
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width .8s ease;
  }
  .area-count {
    min-width: 30px;
    text-align: right;
    font-size: .78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  [data-area="ads"]    .area-label { color: var(--ads); }

  /* TOTALS */
  .total-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 4px;
  }
  .total-item {
    background: #0a1a26;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .total-item .val {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .total-item .lbl { font-size: .72rem; color: var(--muted); letter-spacing: .5px; }

  /* NOTES */
  .notes-list { display: flex; flex-direction: column; gap: 10px; }
  .note-item {
    background: #091522;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
    animation: fadeUp .2s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1} }
  .note-item .note-area {
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .note-item[data-area="ads"]    .note-area { color: var(--ads);    border:1px solid var(--ads);    background: color-mix(in srgb,var(--ads) 12%,transparent); }

  .note-item .note-text {
    font-size: .83rem;
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text);
    word-break: break-word;
  }
  .note-item .note-ts {
    font-size: .68rem;
    color: var(--muted);
    margin-top: 7px;
  }
  .note-item .del-btn {
    position: absolute;
    top: 8px; right: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: .8rem;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
    transition: color .2s;
  }
  .note-item .del-btn:hover { color: #ff6b6b; }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: .85rem;
  }
  .empty-state span { font-size: 2rem; display: block; margin-bottom: 8px; }

  /* FILTER TABS */
  .filter-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .ftab {
    padding: 4px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: .75rem;
    cursor: pointer;
    transition: all .2s;
  }
  .ftab.active, .ftab:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }

  /* SECTION TITLE */
  .section-title {
    font-size: 1rem;
    color: var(--accent);
    margin: 32px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 1px;
  }

  /* CTA button */
  .cta-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 22px;
    background: var(--accent);
    color: #000;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: .85rem;
    transition: opacity .2s;
  }
  .cta-btn:hover { opacity: .85; }

  /* skeleton loader */
  .skeleton {
    background: linear-gradient(90deg, #0b1a27 25%, #0d2a3d 50%, #0b1a27 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
    height: 14px;
    margin: 6px 0;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">APEX</a>
  <nav class="header-nav">
    <a href="/">💬 Chat</a>
    <a href="/estudos" class="active">📊 Estudos</a>
  </nav>
</header>

<main>
  <h1>📊 Painel de Estudos</h1>
  <p class="subtext">Acompanhe seu progresso diário e suas anotações salvas.</p>

  <div class="grid-2">
    <!-- TODAY stats -->
    <div class="card">
      <h2>HOJE</h2>
      <div id="today-stats">
        <div class="skeleton" style="width:100%;height:10px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:80%;height:10px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:90%;height:10px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:60%;height:10px"></div>
      </div>
    </div>

    <!-- TOTAL stats -->
    <div class="card">
      <h2>TOTAL ACUMULADO</h2>
      <div id="total-stats" class="total-grid">
        <div class="skeleton" style="height:72px;border-radius:10px"></div>
        <div class="skeleton" style="height:72px;border-radius:10px"></div>
        <div class="skeleton" style="height:72px;border-radius:10px"></div>
        <div class="skeleton" style="height:72px;border-radius:10px"></div>
      </div>
    </div>
  </div>

  <!-- NOTES SECTION -->
  <h2 class="section-title">📌 Minhas Notas</h2>

  <div class="filter-tabs" id="filter-tabs">
    <button class="ftab active" data-filter="all">Todas</button>
    <button class="ftab" data-filter="ads">💻 ADS</button>
  </div>

  <div id="notes-list">
    <div class="skeleton" style="height:80px;margin-bottom:10px;border-radius:10px"></div>
    <div class="skeleton" style="height:60px;margin-bottom:10px;border-radius:10px"></div>
    <div class="skeleton" style="height:80px;border-radius:10px"></div>
  </div>

  <a href="/" class="cta-btn">💬 Voltar ao Chat</a>
</main>

<script>
  let allNotes = [];
  let currentFilter = 'all';
  const AREA_LABELS = { ads: 'ADS' };

  // ── load data ──────────────────────────────────────────────────────────────
  async function loadAll() {
    const [progressRes, notesRes] = await Promise.all([
      fetch('/api/progress').then(r => r.json()).catch(() => null),
      fetch('/api/notes').then(r => r.json()).catch(() => null),
    ]);
    if (progressRes?.ok) renderProgress(progressRes);
    if (notesRes?.ok) {
      allNotes = notesRes.notes || [];
      renderNotes();
    }
  }

  // ── render progress ────────────────────────────────────────────────────────
  function renderProgress({ today, totals }) {
    const areas = ['ads'];
    const maxToday = Math.max(...areas.map(a => today[a] || 0), 1);

    const todayEl = document.getElementById('today-stats');
    todayEl.innerHTML = areas.map(a => `
      <div class="area-row" data-area="${a}">
        <span class="area-label">${AREA_LABELS[a]}</span>
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${((today[a]||0)/maxToday*100).toFixed(1)}%; background:var(--${a})"></div>
        </div>
        <span class="area-count">${today[a]||0}</span>
      </div>
    `).join('');

    // TOTALS
    const totalEl = document.getElementById('total-stats');
    totalEl.innerHTML = areas.map(a => `
      <div class="total-item">
        <div class="val" style="color:var(--${a})">${totals[a]||0}</div>
        <div class="lbl">${AREA_LABELS[a]}</div>
      </div>
    `).join('');
  }

  // ── render notes ───────────────────────────────────────────────────────────
  function renderNotes() {
    const list = document.getElementById('notes-list');
    const filtered = currentFilter === 'all'
      ? allNotes
      : allNotes.filter(n => n.area === currentFilter);

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state"><span>📝</span>Nenhuma nota ${currentFilter === 'all' ? '' : 'em ' + AREA_LABELS[currentFilter]} ainda.<br>Salve trechos importantes do chat!</div>`;
      return;
    }

    // newest first
    list.innerHTML = [...filtered].reverse().map(n => `
      <div class="note-item" data-area="${n.area}" data-id="${n.id}">
        <span class="note-area">${AREA_LABELS[n.area] || n.area}</span>
        <button class="del-btn" onclick="deleteNote(${n.id})" title="Excluir">✕</button>
        <div class="note-text">${escHtml(n.text)}</div>
        <div class="note-ts">${formatDate(n.ts)}</div>
      </div>
    `).join('');
  }

  // ── delete note ────────────────────────────────────────────────────────────
  async function deleteNote(id) {
    const el = document.querySelector(`.note-item[data-id="${id}"]`);
    if (el) el.style.opacity = '0.4';
    try {
      await fetch('/api/notes', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      allNotes = allNotes.filter(n => n.id !== id);
      renderNotes();
    } catch {
      if (el) el.style.opacity = '1';
    }
  }

  // ── filter tabs ────────────────────────────────────────────────────────────
  document.querySelectorAll('.ftab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderNotes();
    });
  });

  // ── utils ──────────────────────────────────────────────────────────────────
  function escHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch { return iso; }
  }

  loadAll();
</script>
</body>
</html>
