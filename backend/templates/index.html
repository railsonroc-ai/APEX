<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APEX — Tutor Inteligente</title>

    <!-- Highlight.js para blocos de código -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
    >

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"
    ></script>

    <!-- Markdown seguro -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"
    ></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom:
                1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0;
        }

        #memory-badge {
            font-size: 0.85rem;
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        #session-status-badge {
            font-size: 0.8rem;
            padding: 5px 9px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            background: #0f172a;
        }

        #session-status-badge[data-status="studying"] {
            color: #bbf7d0;
            border-color: #166534;
            background: #052e16;
        }

        #session-status-badge[data-status="paused"] {
            color: #fde68a;
            border-color: #92400e;
            background: #451a03;
        }

        #session-status-badge[data-status="reviewing"] {
            color: #bfdbfe;
            border-color: #1d4ed8;
            background: #172554;
        }

        .session-control-btn {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 7px 10px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
            background: #0f172a;
        }

        .session-control-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
        }

        .session-control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .session-panel {
            margin: 12px 20px 0;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #111827;
        }

        .session-panel[hidden] {
            display: none;
        }

        .session-panel-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .session-panel-detail {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .session-panel-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        #resume-direct-btn {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        #resume-review-btn {
            background: #334155;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            text-align: center;
            margin-top: 40px;
            color: #94a3b8;
        }

        .msg {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background:
                var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .msg.user .avatar {
            background: #10b981;
        }

        .bubble {
            background-color:
                var(--panel-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border:
                1px solid var(--border-color);
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg.user .bubble {
            background-color: #1e3a8a;
        }

        .area-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .input-area {
            padding: 16px 20px;
            background-color:
                var(--panel-bg);
            border-top:
                1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background-color: #0f172a;
            border:
                1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-color);
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            max-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color:
                var(--accent-color);
        }

        button#send-btn {
            background-color:
                var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button#send-btn:hover:not(:disabled) {
            background-color: #2563eb;
        }

        button#send-btn:disabled,
        textarea:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .stream-cursor::after {
            content: "▌";
            animation:
                blink 1s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        pre {
            background:
                #0f172a !important;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }

        .save-btn,
        .tts-btn {
            background: none;
            border:
                1px solid var(--border-color);
            color: #cbd5e1;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 6px;
        }

        .save-btn:hover,
        .tts-btn:hover {
            background: #334155;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            display: none;
            z-index: 1000;
        }

        #toast.show {
            display: block;
        }

        @media (max-width: 640px) {
            header {
                align-items: flex-start;
                gap: 10px;
            }

            .header-actions {
                max-width: 70%;
            }

            .session-panel {
                margin-left: 12px;
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>

    <script>
        window.APEX_CHAT_CONFIG = {
            area: 'ads',
            lang: 'pt-BR',
            label: 'ADS',
            maxHistoryMessages: {{ max_history_messages | int }}
        };
    </script>

    <header>
        <h1>⚡ APEX Tutor</h1>

        <div class="header-actions">
            <span
                id="session-status-badge"
                data-status="loading"
                aria-live="polite"
            >
                Sessão: carregando
            </span>

            <button
                id="pause-btn"
                class="session-control-btn"
                type="button"
                disabled
            >
                ⏸ Pausar
            </button>

            <div
                id="memory-badge"
                data-count="0"
            >
                🧠 0 msgs
            </div>
        </div>
    </header>

    <div id="chat-container">

        <section
            id="session-panel"
            class="session-panel"
            hidden
            aria-live="polite"
        >
            <div
                id="session-panel-title"
                class="session-panel-title"
            ></div>

            <div
                id="session-panel-detail"
                class="session-panel-detail"
            ></div>

            <div
                id="session-panel-actions"
                class="session-panel-actions"
            >
                <button
                    id="resume-direct-btn"
                    class="session-control-btn"
                    type="button"
                >
                    ▶ Retomar direto
                </button>

                <button
                    id="resume-review-btn"
                    class="session-control-btn"
                    type="button"
                >
                    ↻ Revisar antes
                </button>
            </div>
        </section>

        <div id="messages">

            <div
                class="welcome"
                id="welcome"
            >
                <h2>Olá, Railson!</h2>

                <p>
                    Faça sua pergunta sobre programação
                    para iniciar a tutoria adaptativa.
                </p>
            </div>

        </div>

        <div class="input-area">

            <textarea
                id="user-input"
                rows="1"
                placeholder="Digite sua dúvida aqui..."
            ></textarea>

            <button
                id="send-btn"
                onclick="sendMessage()"
            >
                Enviar
            </button>

        </div>
    </div>

    <div id="toast"></div>

    <!--
        Ordem importante:
        1. comunicação com backend;
        2. voz;
        3. motor do chat.
    -->
    <script
        src="{{ url_for('static', filename='js/apex-api.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/apex-tts.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/chat-engine.js') }}"
    ></script>

</body>
</html>
