<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020719">
    <title>APEX — Tutor Inteligente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/apex-theme.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
    <script>
        window.APEX_CHAT_CONFIG = {
            area: '{{ area }}',
            lang: 'pt-BR',
            label: '{{ area_label }}',
            maxHistoryMessages: {{ max_history_messages | int }}
        };
    </script>

    <main id="home-screen" class="home-screen" aria-label="Tela inicial do APEX">
        <div id="home-canvas" class="home-canvas">
            <img
                class="home-art"
                src="{{ url_for('static', filename='img/apex-home.jpg') }}"
                alt="APEX formado por linhas de luz em um cenário tecnológico futurista."
                width="1536"
                height="864"
            >

            <header class="home-header" aria-label="Atalhos do APEX">
                <button id="home-logo-btn" class="home-logo-btn" type="button" aria-label="Início do APEX">
                    <span class="mobile-brand" aria-hidden="true"><b>A</b> APEX</span>
                </button>
                <div class="home-tools">
                    <button id="notifications-btn" class="home-tool home-notifications" type="button" aria-label="Notificações" aria-controls="home-panel" aria-expanded="false">
                        <span class="mobile-tool-icon" aria-hidden="true">♧</span>
                        <span id="notification-count" class="notification-count" hidden>0</span>
                    </button>
                    <button id="settings-btn" class="home-tool home-settings" type="button" aria-label="Configurações" aria-controls="home-panel" aria-expanded="false">
                        <span class="mobile-tool-icon" aria-hidden="true">⚙</span>
                    </button>
                </div>
            </header>

            <nav id="home-menu" class="home-menu" aria-label="Menu principal">
                <button id="home-continue-btn" class="home-key home-key-cyan" type="button" data-home-action="continue" aria-controls="home-panel" aria-expanded="false">
                    <span class="home-key-icon" aria-hidden="true">▷</span>
                    <span class="home-key-label">Continuar<br>estudos</span>
                </button>
                <button id="home-review-btn" class="home-key home-key-purple" type="button" data-home-action="review" aria-controls="home-panel" aria-expanded="false">
                    <span class="home-key-icon" aria-hidden="true">▤</span>
                    <span class="home-key-label">Revisar<br>conteúdo</span>
                </button>
                <button id="home-new-btn" class="home-key home-key-cyan" type="button" data-home-action="new" aria-controls="home-panel" aria-expanded="false">
                    <span class="home-key-icon" aria-hidden="true">＋</span>
                    <span class="home-key-label">Novo<br>estudo</span>
                </button>
                <button id="home-progress-btn" class="home-key home-key-gold" type="button" data-home-action="progress" aria-controls="home-panel" aria-expanded="false">
                    <span class="home-key-icon" aria-hidden="true">↗</span>
                    <span class="home-key-label">Progresso</span>
                </button>
            </nav>

            <aside id="home-progress-live" class="home-progress-live" aria-live="polite">
                <span>PROGRESSO REAL</span>
                <strong id="home-progress-value">Carregando…</strong>
                <small id="home-progress-detail">Consultando seu histórico</small>
            </aside>

            <section id="home-panel" class="home-panel" aria-labelledby="home-panel-title" hidden>
                <div class="home-panel-header">
                    <div>
                        <span id="home-panel-kicker" class="home-panel-kicker">APEX</span>
                        <h1 id="home-panel-title">Opções</h1>
                    </div>
                    <button id="home-panel-close" class="home-panel-close" type="button" aria-label="Fechar opções">×</button>
                </div>
                <div id="home-panel-body" class="home-panel-body"></div>
            </section>
        </div>
        <p id="home-live-status" class="visually-hidden" aria-live="polite"></p>
    </main>

    <main id="study-screen" class="study-screen" hidden aria-label="Tela de estudo do APEX">
        <header class="study-header">
            <div class="study-brand-group">
                <button id="back-home-btn" class="study-icon-btn" type="button" aria-label="Voltar para a tela inicial">←</button>
                <div>
                    <h1>APEX Tutor</h1>
                    <small>{{ area_label }}</small>
                </div>
            </div>
            <div class="header-actions">
                <span id="session-status-badge" data-status="loading" aria-live="polite">Sessão: carregando</span>
                <button id="pause-btn" class="session-control-btn" type="button" disabled>⏸ Pausar</button>
                <div id="memory-badge" data-count="0">🧠 0 msgs</div>
            </div>
        </header>

        <div id="chat-container">
            <section id="learning-focus" class="learning-focus" hidden aria-live="polite">
                <strong id="learning-focus-title"></strong>
                <span id="learning-focus-detail"></span>
            </section>

            <section id="session-panel" class="session-panel" hidden aria-live="polite">
                <div id="session-panel-title" class="session-panel-title"></div>
                <div id="session-panel-detail" class="session-panel-detail"></div>
                <div id="session-panel-actions" class="session-panel-actions">
                    <button id="resume-direct-btn" class="session-control-btn" type="button">▶ Retomar direto</button>
                    <button id="resume-review-btn" class="session-control-btn" type="button">↻ Revisar antes</button>
                </div>
            </section>

            <div id="messages">
                <div class="welcome" id="welcome">
                    <h2>Olá, Railson!</h2>
                    <p>Faça sua pergunta sobre programação para iniciar a tutoria adaptativa.</p>
                </div>
            </div>

            <div class="input-area">
                <textarea id="user-input" rows="1" placeholder="Diga o que você quer aprender..."></textarea>
                <button id="send-btn" type="button" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/apex-api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/apex-tts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat-engine.js') }}"></script>
    <script src="{{ url_for('static', filename='js/apex-shell.js') }}"></script>
</body>
</html>
