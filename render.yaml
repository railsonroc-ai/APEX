services:
  - type: web
    name: apex
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: ./start_apex.sh

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: GROQ_MODEL
        value: groq/compound

      - key: AI_DIALOG_TIMEOUT_SECONDS
        value: "45"

      - key: GROQ_API_KEY
        sync: false

      - key: APEX_ACCESS_KEY
        sync: false

      - key: SECRET_KEY
        sync: false